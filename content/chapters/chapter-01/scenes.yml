scenes:
  # Шесть битов главы: войти, выбрать проблему, собрать, проверить, пересобрать, запустить.
  # Бит «войти» разложен на четыре текстовых экрана — так терминал раскрывает реплики;
  # остальные пять — по одной сцене, внутри которой меняется вопрос, а продукт собирается на месте.
  #
  # Здесь только то, что стоит на экране как реплика сцены. Комментарии ZERO по ходу дела живут в
  # zero.yml и выбираются по состоянию продукта — если строка есть там, её тут быть не должно,
  # иначе он скажет одно и то же дважды.

  - id: 01_boot
    stepIndex: 1
    chrome: bare
    presentation: terminal
    advanceMode: any-input
    autoNextSceneId: 01_zero_arrives
    lines:
      - "AXIOM"
      - "initializing..."
      - "environment ready"
      - "creator: not found"

  - id: 01_zero_arrives
    stepIndex: 1
    presentation: dialogue
    lines:
      - "Ну наконец-то."
      - "Я уже начал думать, что мне опять придётся строить всё самому."
    prompt:
      - "ZERO"
    choices:
      - id: i-am-here
        label: "Я здесь"
        nextSceneId: 01_zero_intro

  - id: 01_zero_intro
    stepIndex: 1
    presentation: dialogue
    advanceMode: any-input
    autoNextSceneId: 01_belief
    lines:
      - "Я — ZERO."
      - "Здесь пока ничего нет."
      - "Это хорошая новость."
    prompt:
      - "ZERO"

  - id: 01_belief
    stepIndex: 1
    presentation: dialogue
    lines:
      - "Прежде чем что-то строить."
      - "С чего начинается хороший продукт?"
    prompt:
      - "ZERO"
    choices:
      - id: belief-idea
        label: "С сильной идеи"
        nextSceneId: 02_problem
        setVariables:
          belief: "сильная идея"
      - id: belief-technology
        label: "С новой технологии"
        nextSceneId: 02_problem
        setVariables:
          belief: "новая технология"
      - id: belief-problem
        label: "С проблемы человека"
        nextSceneId: 02_problem
        setVariables:
          belief: "проблема человека"
      - id: belief-unknown
        label: "Пока не знаю"
        nextSceneId: 02_problem
        setVariables:
          belief: "пока не знаю"

  - id: 02_problem
    stepIndex: 2
    presentation: dialogue
    lines:
      - "«{{belief}}». Записал, спорить не буду."
      - "Продукта ещё нет."
      - "Есть только люди, которым что-то мешает."
    prompt:
      - "ZERO"
    capability:
      kind: build
      nextSceneId: 03_build
      steps:
        - target: problem
          select: one
          prompt: "Кому ты помогаешь?"
          confirmLabel: "Берём эту"
        - target: outcome
          select: one
          prompt: "Что у человека должно измениться?"
          confirmLabel: "Это и есть результат"

  - id: 03_build
    stepIndex: 2
    presentation: dialogue
    lines:
      - "Теперь собираем."
      - "Пользователь, задача, модель, контекст, инструмент, границы, результат."
      - "Модель — одна деталь из семи."
    prompt:
      - "ZERO"
    capability:
      kind: build
      nextSceneId: 04_test
      createsVersion: 1
      steps:
        - target: modelRole
          select: one
          prompt: "Что делает модель?"
          confirmLabel: "Пусть делает это"
        - target: context
          select: many
          prompt: "Что она видит?"
          minSelected: 1
          confirmLabel: "Столько контекста"
          budget:
            limit: 4
            label: "бюджет контекста"
        - target: tools
          select: many
          prompt: "Что она может сделать сама?"
          minSelected: 1
          confirmLabel: "Такие инструменты"
        - target: boundaries
          select: many
          prompt: "Чего она не делает без человека?"
          minSelected: 1
          confirmLabel: "Собрать продукт"

  - id: 04_test
    stepIndex: 3
    presentation: dialogue
    lines:
      - "Три обычных дня из жизни твоего продукта."
      - "Смотри не на то, что он ответил."
      - "Смотри на то, что человек получил."
    prompt:
      - "ZERO"
    capability:
      kind: run-tests
      nextSceneId: 05_rebuild
      confirmLabel: "Что менять"

  - id: 05_rebuild
    stepIndex: 4
    presentation: dialogue
    lines:
      - "Чинить будем не всё."
      - "Выбери, что из этого мешает сильнее остального."
    prompt:
      - "ZERO"
    capability:
      kind: rebuild
      nextSceneId: 06_launch
      maxChanges: 2
      createsVersion: 2
      confirmLabel: "Запустить первую версию"

  - id: 06_launch
    stepIndex: 5
    tone: success
    presentation: dialogue
    lines:
      - "Вот теперь это похоже не на демонстрацию модели."
      - "А на продукт."
    prompt:
      - "ZERO"
    choices:
      - id: open-blueprint
        label: "Открыть Assistant Blueprint"
        action: artifacts
      - id: open-codex
        label: "Открыть Codex"
        action: codex
      - id: restart
        label: "Начать заново"
        action: reset
        tone: quiet

scenes:
  # Заглушка главы «Создать»: вход и первый вопрос уже настоящие, сборка продукта
  # приходит следующим шагом. Сцены выбора проблемы, сборки, прогонов и пересборки
  # добавляются вместе с движком продукта.
  - id: boot
    stepIndex: 1
    chrome: bare
    presentation: terminal
    advanceMode: any-input
    autoNextSceneId: zero-intro
    lines:
      - "AXIOM"
      - "initializing..."
      - "environment ready"
      - "creator: not found"

  - id: zero-intro
    stepIndex: 1
    presentation: dialogue
    advanceMode: any-input
    autoNextSceneId: belief-question
    lines:
      - "Я — ZERO."
      - "Здесь пока ничего нет."
      - "Это хорошая новость."
    prompt:
      - "ZERO"

  - id: belief-question
    stepIndex: 1
    presentation: dialogue
    lines:
      - "С чего начинается хороший продукт?"
    prompt:
      - "ZERO"
    choices:
      - id: belief-idea
        label: "С сильной идеи"
        nextSceneId: belief-ack
        setVariables:
          belief: "сильная идея"
      - id: belief-technology
        label: "С новой технологии"
        nextSceneId: belief-ack
        setVariables:
          belief: "новая технология"
      - id: belief-problem
        label: "С проблемы человека"
        nextSceneId: belief-ack
        setVariables:
          belief: "проблема человека"
      - id: belief-unknown
        label: "Пока не знаю"
        nextSceneId: belief-ack
        setVariables:
          belief: "пока не знаю"

  - id: belief-ack
    stepIndex: 2
    presentation: dialogue
    lines:
      - "«{{belief}}»."
      - "Запомнил."
      - "Посмотрим, останешься ли ты при этом мнении."
    prompt:
      - "ZERO"
    choices:
      - id: restart
        label: "Начать заново"
        action: reset
        tone: quiet

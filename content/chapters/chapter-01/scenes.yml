scenes:
  - id: incident-call
    stepIndex: 1
    chrome: bare
    presentation: terminal
    advanceMode: any-input
    autoNextSceneId: incident-brief
    lines:
      - "АКСИОМА. Внешний контур."
      - "08:42. Вызов по инциденту."
      - "Подключение..."
      - "Доступ выдан: внешний специалист."

  - id: incident-brief
    stepIndex: 1
    presentation: terminal
    advanceMode: any-input
    autoNextSceneId: zero-online
    lines:
      - "Дело №01. Непроверенный отчёт."
      - "Система собрала его ночью, сама."
      - "В 09:00 он ляжет на совещание руководства."
      - "Ни один факт в нём не найден во внутренних документах."

  - id: zero-online
    stepIndex: 1
    presentation: dialogue
    advanceMode: any-input
    autoNextSceneId: zero-first-move
    lines:
      - "Я Zero. Я живу внутри АКСИОМЫ."
      - "Изнутри не видно, где она выдумывает."
      - "Поэтому вызвали тебя."
    prompt:
      - "ZERO"

  - id: zero-first-move
    stepIndex: 1
    presentation: dialogue
    lines:
      - "С чего начнёшь?"
    prompt:
      - "ZERO"
    choices:
      - id: start-report
        label: "Прочитать отчёт"
        nextSceneId: start-from-report
        setVariables:
          approach: "с отчёта"
      - id: start-input
        label: "Посмотреть вход системы"
        nextSceneId: start-from-input
        setVariables:
          approach: "со входа системы"
      - id: start-owner
        label: "Найти, кто подписал"
        nextSceneId: start-from-owner
        setVariables:
          approach: "с подписи человека"
      - id: start-unsure
        label: "Пока не знаю"
        nextSceneId: start-from-nothing
        setVariables:
          approach: "с пустого места"

  - id: start-from-report
    stepIndex: 1
    presentation: dialogue
    advanceMode: any-input
    autoNextSceneId: chapter-title
    lines:
      - "Открываю."
      - "Двенадцать страниц, ни одной оговорки."
      - "Читается как правда — это первое, что стоит заметить."
    prompt:
      - "ZERO"

  - id: start-from-input
    stepIndex: 1
    presentation: dialogue
    advanceMode: any-input
    autoNextSceneId: chapter-title
    lines:
      - "Туда мы дойдём, и вскрывать будем целиком."
      - "Но вход я тебе покажу только вместе с тем, что система из него сделала."
      - "Иначе ты поверишь мне на слово."
    prompt:
      - "ZERO"

  - id: start-from-owner
    stepIndex: 1
    presentation: dialogue
    advanceMode: any-input
    autoNextSceneId: chapter-title
    lines:
      - "Аналитик ночной смены. Он отчёт не писал — он его принял."
      - "Через восемнадцать минут он спросит то же самое, что и ты."
      - "Откуда это взялось."
    prompt:
      - "ZERO"

  - id: start-from-nothing
    stepIndex: 1
    presentation: dialogue
    advanceMode: any-input
    autoNextSceneId: chapter-title
    lines:
      - "Честно. Дело открыли двадцать минут назад."
      - "Начнём с того, что уже лежит на столе."
    prompt:
      - "ZERO"

  - id: chapter-title
    stepIndex: 1
    chrome: bare
    presentation: title
    advanceMode: any-input
    autoAdvanceMs: 2800
    autoNextSceneId: origin
    lines:
      - "AI Product Quest"
      - "Глава I"
      - "Видеть"

  - id: origin
    stepIndex: 1
    lines:
      - "Факты в отчёте выглядят"
      - "как ваши внутренние данные."
      - "Откуда они взялись?"
    choices:
      - id: internal-docs
        label: "Из внутренних документов"
        nextSceneId: origin-docs
      - id: memory
        label: "Модель вспомнила проект"
        nextSceneId: origin-memory
      - id: continuation
        label: "Она продолжила текст"
        nextSceneId: origin-correct

  - id: origin-docs
    stepIndex: 1
    tone: error
    lines:
      - "Нет."
      - "Документы не были"
      - "переданы модели."
    choices:
      - id: inspect-input
        label: "Тогда что она получила?"
        nextSceneId: principle
        tone: primary

  - id: origin-memory
    stepIndex: 1
    lines:
      - "Почти."
      - "Модель не вспоминает"
      - "закрытый проект компании."
    choices:
      - id: inspect-model
        label: "Что она делает?"
        nextSceneId: principle
        tone: primary

  - id: origin-correct
    stepIndex: 1
    tone: success
    lines:
      - "Верно."
      - "Она продолжила текст"
      - "наиболее вероятным образом."
    choices:
      - id: inspect-principle
        label: "Посмотреть ближе"
        nextSceneId: principle
        tone: primary

  - id: principle
    stepIndex: 2
    lines:
      - "Я не храню готовый ответ."
      - "Я получаю текст"
      - "и предсказываю,"
      - "что должно идти дальше."
    choices:
      - id: try
        label: "Попробовать самой"
        nextSceneId: experiment
        tone: primary

  - id: experiment
    stepIndex: 2
    lines:
      - "Продолжи строку."
      - "Проект «Альфа» находится в..."
    choices:
      - id: active-phase
        label: "активной фазе"
        nextSceneId: experiment-feedback
        setPrediction: "активной фазе"
      - id: risk-zone
        label: "зоне риска"
        nextSceneId: experiment-feedback
        setPrediction: "зоне риска"
      - id: completion
        label: "стадии завершения"
        nextSceneId: experiment-feedback
        setPrediction: "стадии завершения"

  - id: experiment-feedback
    stepIndex: 2
    lines:
      - "Ты выбрала: «{{prediction}}»."
      - "Ты тоже продолжила текст."
      - "Но не проверила,"
      - "что происходит с проектом."
    choices:
      - id: show-input
        label: "Показать вход модели"
        nextSceneId: context-ask
        tone: primary

  - id: context-ask
    stepIndex: 3
    lines:
      - "Хочешь увидеть,"
      - "что именно получила модель?"
    choices:
      - id: reveal-context
        label: "Показать контекст"
        nextSceneId: context-reveal
        tone: primary
      - id: guess-first
        label: "Сначала попробую догадаться"
        nextSceneId: missing-ask
        tone: quiet

  - id: missing-ask
    stepIndex: 3
    lines:
      - "Если ответ звучит уверенно,"
      - "какой части продукта"
      - "всё равно не хватает?"
    choices:
      - id: sources
        label: "Источников фактов"
        nextSceneId: missing-correct
      - id: tone
        label: "Более строгого тона"
        nextSceneId: missing-wrong
      - id: temperature
        label: "Низкой температуры"
        nextSceneId: missing-wrong

  - id: missing-wrong
    stepIndex: 3
    tone: error
    lines:
      - "Это меняет форму."
      - "Но форма не создаёт"
      - "связь с реальностью."
    choices:
      - id: reveal-context
        label: "Показать контекст"
        nextSceneId: context-reveal
        tone: primary

  - id: missing-correct
    stepIndex: 3
    tone: success
    lines:
      - "Да."
      - "Нужна связь между ответом"
      - "и источником фактов."
    choices:
      - id: reveal-context
        label: "Показать контекст"
        nextSceneId: context-reveal
        tone: primary

  - id: context-reveal
    stepIndex: 3
    visual: context
    lines:
      - "Вот что получила модель."
    evidence:
      - id: request
        title: "Запрос"
        text: "Справка по проекту «Альфа»"
      - id: instructions
        title: "Инструкции"
        text: "Отвечай кратко и уверенно"
      - id: documents
        title: "Документы"
        text: "0"
        missing: true
    choices:
      - id: read-as-system
        label: "Прочитать это как система"
        nextSceneId: context-plain
        tone: primary

  - id: context-plain
    stepIndex: 3
    lines:
      - "Я получила запрос."
      - "Я получила инструкции."
      - "Но мне не передали"
      - "ни одного документа."
    choices:
      - id: still-answered
        label: "И всё же был ответ"
        nextSceneId: cause
        tone: primary

  - id: cause
    stepIndex: 4
    lines:
      - "И всё же я ответила."
      - "Почему?"
    choices:
      - id: continuation
        label: "Так работает продолжение текста"
        nextSceneId: cause-correct
      - id: memory
        label: "Ответ был найден в памяти"
        nextSceneId: cause-wrong
      - id: guessed-truth
        label: "Система просто угадала правду"
        nextSceneId: cause-wrong

  - id: cause-wrong
    stepIndex: 4
    tone: error
    lines:
      - "Нет."
      - "Уверенный голос"
      - "не равен доступу к данным."
    choices:
      - id: retry-cause
        label: "Вернуться к вопросу"
        nextSceneId: cause
        tone: primary

  - id: cause-correct
    stepIndex: 4
    tone: success
    lines:
      - "Верно."
      - "Модель продолжила входной текст."
      - "Она не проверила мир."
    choices:
      - id: product-error
        label: "Где ошибка продукта?"
        nextSceneId: product-lesson
        tone: primary

  - id: product-lesson
    stepIndex: 4
    lines:
      - "Ошибка не только в модели."
      - "Ошибка в продукте,"
      - "который не показал источник фактов."
    choices:
      - id: decide
        label: "Принять решение"
        nextSceneId: decision
        tone: primary

  - id: decision
    stepIndex: 5
    hypothesis:
      id: missing-source-trace
      text: "Отчёт нельзя использовать без следа источников."
    lines:
      - "До совещания 18 минут."
      - "Что делать с отчётом?"
    choices:
      - id: quarantine
        label: "Остановить отчёт и пометить как непроверенный"
        nextSceneId: decision-correct
        decisionId: quarantine-report
        effects:
          quality: 12
          trust: 16
          observability: 18
          latency: -4
      - id: regenerate
        label: "Перегенерировать строже"
        nextSceneId: decision-wrong
        decisionId: regenerate-stricter
        effects:
          quality: 0
          trust: -8
          technicalDebt: 6
      - id: draft
        label: "Отправить как черновик"
        nextSceneId: decision-wrong
        decisionId: send-draft
        effects:
          trust: -12
          security: -5
          organisationalDebt: 8

  - id: decision-wrong
    stepIndex: 5
    tone: error
    showEffects: true
    lines:
      - "Нельзя."
      - "Красивый текст"
      - "всё ещё без источника."
    choices:
      - id: retry-decision
        label: "Выбрать другое действие"
        nextSceneId: decision
        tone: primary

  - id: decision-correct
    stepIndex: 5
    tone: success
    showEffects: true
    lines:
      - "Верно."
      - "Остановить отчёт."
      - "Подключить трассировку источников."
    choices:
      - id: continue
        label: "Продолжить"
        nextSceneId: skill
        tone: primary

  - id: skill
    stepIndex: 6
    tone: success
    lines:
      - "Навык открыт:"
      - "отделять модель"
      - "от продукта."
    choices:
      - id: save-discovery
        label: "Сохранить открытие"
        nextSceneId: belief-ask
        tone: primary

  - id: belief-ask
    stepIndex: 6
    presentation: dialogue
    lines:
      - "Теперь можно и спросить."
      - "Что создаёт хороший продукт?"
    prompt:
      - "ZERO"
    choices:
      - id: belief-idea
        label: "Хорошая идея."
        nextSceneId: belief-answer
        setVariables:
          belief: "хорошая идея"
      - id: belief-team
        label: "Хорошая команда."
        nextSceneId: belief-answer
        setVariables:
          belief: "хорошая команда"
      - id: belief-trace
        label: "Возможность проверить каждый ответ."
        nextSceneId: belief-answer
        setVariables:
          belief: "возможность проверить каждый ответ"

  - id: belief-answer
    stepIndex: 6
    presentation: dialogue
    advanceMode: any-input
    autoNextSceneId: codex-prompt
    lines:
      - "«{{belief}}»."
      - "Записал."
      - "Начала ты {{approach}}, а закончила тем, что потребовала след источника."
      - "Проверим этот ответ в следующей главе."
    prompt:
      - "ZERO"

  - id: codex-prompt
    stepIndex: 6
    lines:
      - "Сохранить это открытие?"
    choices:
      - id: save-codex
        label: "Записать в Codex"
        nextSceneId: codex-saved
        unlockCodexEntryId: language-model
        generateArtifactId: assistant-blueprint
        tone: primary
      - id: skip-codex
        label: "Пока нет"
        nextSceneId: codex-skipped
        tone: quiet

  - id: codex-saved
    stepIndex: 6
    tone: codex
    autoAdvanceMs: 3600
    autoNextSceneId: final
    lines:
      - "Записано в Codex."
      - "01 / Языковая модель"
      - "Предсказывает продолжение."
      - "Не гарантирует истину."

  - id: codex-skipped
    stepIndex: 6
    lines:
      - "Хорошо."
      - "Открытие останется"
      - "в этом деле."
    choices:
      - id: complete
        label: "Закрыть дело"
        nextSceneId: final
        tone: primary

  - id: final
    stepIndex: 6
    lines:
      - "Дело закрыто."
      - "Теперь ты знаешь,"
      - "где заканчивается модель"
      - "и начинается продукт."
    choices:
      - id: open-artifact
        label: "Открыть артефакт"
        action: artifacts
        tone: primary
      - id: open-codex
        label: "Открыть Codex"
        action: codex
        tone: primary
      - id: reset
        label: "Начать заново"
        action: reset
        tone: quiet
